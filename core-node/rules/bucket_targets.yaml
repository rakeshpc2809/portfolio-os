    fund_name: "Kotak Nifty 100 Equal Weight Index Fund Direct Growth"
    reason: "Legacy core index holding slated for systematic tax-free LTCG liquidation"
  - isin: "INF247L01916"
    fund_name: "Motilal Oswal Nifty Midcap 150 Index Fund Direct Growth"
