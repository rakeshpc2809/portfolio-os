  - isin: "INF247L01BQ9"
    fund_name: "Motilal Oswal Nifty Microcap 250 Index Fund Direct Growth"
    reason: "Legacy microcap holding slated for systematic tax-free LTCG liquidation"
  - isin: "INF769K01ED6"
    fund_name: "Mirae Asset Healthcare Fund Direct Growth"
    reason: "Legacy sectoral holding slated for systematic tax-free LTCG liquidation"

