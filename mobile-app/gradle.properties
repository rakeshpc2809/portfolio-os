android.useAndroidX=true
android.nonFinalResIds=false

# JVM Memory & GC Tuning (optimized for multi-core systems)
org.gradle.jvmargs=-Xmx6144m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Multi-core Parallelism & Daemon
org.gradle.parallel=true
org.gradle.daemon=true

# Advanced Caching & File System Watching
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin Incremental Compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
org.gradle.java.installations.paths=/home/rakeshpc/.jdks/jdk-21

