services:
  core-node:
    build:
      context: ./core-node
      dockerfile: Containerfile
    container_name: portfolio-os-core
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      - API_AUTH_TOKEN=dev_secret_key_123
      - LEDGER_HMAC_SECRET=dev_secret_key_123
      - SPRING_PROFILES_ACTIVE=prod
      - SQLITE_PATH=/app/data/tax_ledger.db
      - DUCKDB_PATH=/app/data/tax_ledger.duckdb
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/portfolio_ledger
      - SPRING_DATASOURCE_USERNAME=portfolio_admin
      - SPRING_DATASOURCE_PASSWORD=portfolio_secure_pass
      - OLLAMA_HOST=http://host.containers.internal:11434
      - SIDECAR_HTTP_URL=http://quant-sidecar:8000
      - SIDECAR_FLIGHT_URL=grpc+tcp://quant-sidecar:8001
      - QUANT_SIDECAR_HOST=quant-sidecar
    volumes:
      - ./data:/app/data
      - ./core-node/rules:/app/rules:ro
    depends_on:
      db:
        condition: service_healthy
      quant-sidecar:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    extra_hosts:
      - "host.containers.internal:host-gateway"
    restart: unless-stopped

  db:
    image: docker.io/timescale/timescaledb:latest-pg16
    container_name: portfolio-os-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=portfolio_ledger
      - POSTGRES_USER=portfolio_admin
      - POSTGRES_PASSWORD=portfolio_secure_pass
      - PGDATA=/var/lib/postgresql/data/pgdata
    command: >
      postgres
        -c shared_buffers=512MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c effective_cache_size=2GB
        -c max_connections=50
        -c synchronous_commit=off
        -c wal_writer_delay=200ms
    volumes:
      - ${HOME}/.local/share/portfolio-os/db:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_admin -d portfolio_ledger"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  quant-sidecar:
    build:
      context: ./quant-sidecar
      dockerfile: Dockerfile
    container_name: portfolio-os-quant
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      - OLLAMA_HOST=http://host.containers.internal:11434
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.containers.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped
