name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests in core-node
        working-directory: core-node
        run: mvn -B clean test

      - name: Dump Surefire Reports on Failure
        if: failure()
        run: |
          echo "=== FAILED TESTS DETAILS ==="
          for f in core-node/target/surefire-reports/*.txt; do
            if [ -f "$f" ] && (grep -q "<<< FAILURE!" "$f" || grep -q "<<< ERROR!" "$f"); then
              echo "----------------------------------------"
              echo "FILE: $f"
              echo "----------------------------------------"
              cat "$f"
            fi
          done

